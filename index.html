<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#8f0c21" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Wukong Español" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icono.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>Wukong Español · 悟空西语 · DELE</title>
    <style>
      html, body { background: #8f0c21; }
      /* Pantalla de arranque: laca roja con el sello dorado, como el icono de la app */
      #initial-loader {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; align-items: center; justify-content: center; flex-direction: column;
        background: radial-gradient(circle at 50% 40%, #e0485a, #c8102e 38%, #6e0818 100%);
        transition: opacity .35s ease, transform .35s ease;
      }
      #initial-loader.hidden { opacity: 0; transform: scale(1.04); pointer-events: none; }
      #initial-loader img { width: 112px; height: 112px; border-radius: 26px; box-shadow: 0 18px 40px rgba(40,0,8,.55); animation: latir 1.6s ease-in-out infinite; }
      #initial-loader h2 { margin: 18px 0 0; color: #ffe08a; font: 700 1.3rem Georgia, "Songti SC", serif; letter-spacing: .08em; }
      #initial-loader p { margin: 6px 0 0; color: rgba(255,243,214,.75); font: .85rem system-ui, "PingFang SC", sans-serif; }
      #initial-loader .barra { width: 120px; height: 4px; margin-top: 18px; border-radius: 4px; background: rgba(255,224,138,.25); overflow: hidden; }
      #initial-loader .barra i { display: block; width: 40%; height: 100%; border-radius: 4px; background: #f2c14e; animation: correr 1.1s ease-in-out infinite; }
      @keyframes latir { 50% { transform: scale(1.05); } }
      @keyframes correr { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { #initial-loader img, #initial-loader .barra i { animation: none; } }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script>
      // En cuanto llega la hoja de Google se piden ya las fuentes que usará la pantalla, sin esperar a que React pinte
      // el texto que las necesita: así llegan antes del contenido y no hay un segundo relayout ni saltos (CLS 0,25 en el
      // examen). Son fuentes variables (un fichero por familia para todos los pesos). Si Google no responde, no se hace nada.
      window.__pideFuentes = function () {
        if (!document.fonts || !document.fonts.load) return;
        var pedidas = window.__fuentesPedidas = window.__fuentesPedidas || {};
        var pide = function (caras) { caras.forEach(function (c) { if (!pedidas[c]) { pedidas[c] = 1; document.fonts.load(c).catch(function () {}); } }); };
        var porRuta = function () {
          var h = location.hash;
          if (/^#\/(oficial\/[^/]+\/[^/]+|examenes)/.test(h)) pide(['400 1em "Source Serif 4"', '600 1em "Source Serif 4"', '500 1em "JetBrains Mono"', '700 1em "JetBrains Mono"']);
          if (/^#\/(ruta|oficial)\/?$/.test(h)) pide(['500 1em Unbounded', '700 1em Unbounded', '900 1em Unbounded']);
        };
        pide(['400 1em "Plus Jakarta Sans"', '500 1em "Plus Jakarta Sans"', '600 1em "Plus Jakarta Sans"', '700 1em "Plus Jakarta Sans"', '800 1em "Plus Jakarta Sans"', '600 1em Cinzel', '700 1em Cinzel', '900 1em Cinzel']);
        porRuta();
        window.addEventListener('hashchange', porRuta);
      };
    </script>
    <!-- Sin bloquear el primer pintado: si Google Fonts no responde (China), se ve con las fuentes del sistema -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Unbounded:wght@500;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" media="print" onload="this.media='all';window.__pideFuentes()" />
</head>
  <body>
    <!-- Loader OUTSIDE #root so React never touches it -->
    <div id="initial-loader">
      <img src="./icons/icon-192.png" alt="" />
      <h2>Wukong Español</h2>
      <p>Cargando · 加载中…</p>
      <div class="barra"><i></i></div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>


    <noscript>
      <div style="position:fixed;inset:0;background:#050714;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#fff;font-family:system-ui,sans-serif;text-align:center;padding:20px;">
        <h2 style="color:#ff8a2a;margin-bottom:10px;">JavaScript requerido</h2>
        <p>Esta aplicación necesita JavaScript para funcionar. Por favor, habilita JavaScript en tu navegador.</p>
      </div>
    </noscript>
  </body>
</html>
