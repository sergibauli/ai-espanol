<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#8f0c21" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Wukong Español" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icono.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>Wukong Español · 悟空西语</title>
    <style>
      html, body { background: #8f0c21; }
      /* Pantalla de arranque: laca roja con el sello dorado, como el icono de la app */
      #initial-loader {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; align-items: center; justify-content: center; flex-direction: column;
        background: radial-gradient(circle at 50% 40%, #e0485a, #c8102e 38%, #6e0818 100%);
        transition: opacity .35s ease, transform .35s ease;
      }
      #initial-loader.hidden { opacity: 0; transform: scale(1.04); pointer-events: none; }
      #initial-loader img { width: 112px; height: 112px; border-radius: 26px; box-shadow: 0 18px 40px rgba(40,0,8,.55); animation: latir 1.6s ease-in-out infinite; }
      #initial-loader h2 { margin: 18px 0 0; color: #ffe08a; font: 700 1.3rem Georgia, "Songti SC", serif; letter-spacing: .08em; }
      #initial-loader p { margin: 6px 0 0; color: rgba(255,243,214,.75); font: .85rem system-ui, "PingFang SC", sans-serif; }
      #initial-loader .barra { width: 120px; height: 4px; margin-top: 18px; border-radius: 4px; background: rgba(255,224,138,.25); overflow: hidden; }
      #initial-loader .barra i { display: block; width: 40%; height: 100%; border-radius: 4px; background: #f2c14e; animation: correr 1.1s ease-in-out infinite; }
      @keyframes latir { 50% { transform: scale(1.05); } }
      @keyframes correr { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { #initial-loader img, #initial-loader .barra i { animation: none; } }
    </style>
    <!-- Fuentes servidas desde la propia web (public/fuentes, variables, subconjunto latino con ñ, á, ¿, ¡).
         Antes venían de Google Fonts, que en China no carga: allí se veía todo con las fuentes del sistema.
         Las dos de la primera pantalla se precargan; el resto se pide solo cuando una pantalla las usa. -->
    <link rel="preload" href="./fuentes/plus-jakarta-sans.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./fuentes/cinzel.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face { font-family: "Cinzel"; font-style: normal; font-weight: 400 900; font-display: swap; src: url("./fuentes/cinzel.woff2") format("woff2"); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
      @font-face { font-family: "Unbounded"; font-style: normal; font-weight: 200 900; font-display: swap; src: url("./fuentes/unbounded.woff2") format("woff2"); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
      @font-face { font-family: "Plus Jakarta Sans"; font-style: normal; font-weight: 200 800; font-display: swap; src: url("./fuentes/plus-jakarta-sans.woff2") format("woff2"); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
      @font-face { font-family: "JetBrains Mono"; font-style: normal; font-weight: 100 800; font-display: swap; src: url("./fuentes/jetbrains-mono.woff2") format("woff2"); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
      @font-face { font-family: "Source Serif 4"; font-style: normal; font-weight: 200 900; font-display: swap; src: url("./fuentes/source-serif-4.woff2") format("woff2"); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
    </style>
</head>
  <body>
    <!-- Loader OUTSIDE #root so React never touches it -->
    <div id="initial-loader">
      <img src="./icons/icon-192.png" alt="" />
      <h2>Wukong Español</h2>
      <p>Cargando · 加载中…</p>
      <div class="barra"><i></i></div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>


    <noscript>
      <div style="position:fixed;inset:0;background:#050714;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#fff;font-family:system-ui,sans-serif;text-align:center;padding:20px;">
        <h2 style="color:#ff8a2a;margin-bottom:10px;">JavaScript requerido</h2>
        <p>Esta aplicación necesita JavaScript para funcionar. Por favor, habilita JavaScript en tu navegador.</p>
      </div>
    </noscript>
  </body>
</html>
