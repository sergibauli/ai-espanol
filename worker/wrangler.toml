name = "ai-espanol-campus"
main = "src/index.js"
compatibility_date = "2026-09-01"

# KV del campus: crea con `npx wrangler kv namespace create CAMPUS` y pega el id
[[kv_namespaces]]
binding = "CAMPUS"
id = "c107aa1fe2284a9c8ad63f04d0d9aa0e"

[vars]
ALLOWED_ORIGINS = "https://sergibauli.github.io,https://ai-espanol.pages.dev,https://ai-espanol-web.sergibaulis.workers.dev,http://localhost:5173"
# Instancia de Clerk (sale de la publishable key). En producción, la de la instancia pk_live.
CLERK_ISSUER = "https://composed-kitten-70.clerk.accounts.dev"
# Secretos (no van aquí, el repositorio es público):
#   npx wrangler secret put CLERK_SECRET_KEY   → sk_test_… / sk_live_… de Clerk
#   npx wrangler secret put ADMIN_EMAILS       → emails con acceso de administración, separados por comas
#   npx wrangler secret put DEEPSEEK_API_KEY   → clave de DeepSeek para el tutor IA (proxy /ai/chat)
#   npx wrangler secret put FISH_API_KEY       → clave de Fish Audio para la voz (proxy /ai/tts)
# Cuotas diarias de IA (opcional): AI_DAILY_USER = "200", AI_DAILY_ANON = "20"
